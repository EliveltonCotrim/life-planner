[package]
name = "life-planner"
version = "0.1.0"
description = "Life Planner desktop application"
authors = ["Life Planner"]
edition = "2024"

[lib]
name = "life_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
